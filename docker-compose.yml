services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sahayam-postgis
    environment:
      POSTGRES_DB: sahayam
      POSTGRES_USER: sahayam
      POSTGRES_PASSWORD: sahayam_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayam -d sahayam"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
